name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean-native build + verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"

      - name: Build Lean executable
        run: lake build

      - name: Run Lean tests
        run: lake test

      - name: Verify, attest, and check root drift
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly verform=.lake/build/bin/verform
          readonly ci_lock=.verform-ci.lock.json
          cleanup() {
            local rc=$?
            trap - EXIT
            rm -f -- "$ci_lock"
            exit "$rc"
          }
          trap cleanup EXIT
          "$verform" status .
          "$verform" check .
          "$verform" attest . --output "$ci_lock"
          "$verform" status . --lock "$ci_lock"
          cmp --silent -- verform.lock.json "$ci_lock" || {
            diff --unified -- verform.lock.json "$ci_lock"
            exit 1
          }

      - name: Verify generated templates + adversarial probes
        run: scripts/verify-templates.sh

      - name: Require clean tracked tree
        run: git diff --exit-code
